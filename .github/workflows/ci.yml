name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tend
          POSTGRES_PASSWORD: tend
          POSTGRES_DB: tend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tend -d tend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tend:tend@localhost:5432/tend
      SESSION_SECRET: ci-test-session-secret-must-be-32-chars-min

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, migrate, test, and build
        run: bun run ci:check
